name: CLA

# A contributor signs once, by replying to the bot on their first pull request.
# The signature -- username, date and the commit it was given on -- is committed
# to signatures/cla.json in this repository, so the record lives with the project
# rather than in a third-party service.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Signed
    runs-on: ubuntu-latest
    # Run for pull requests, and for comments that are on a pull request -- an
    # issue_comment fires for plain issues too, where there is nothing to sign.
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writing the signature file is a push, which the job's own
          # GITHUB_TOKEN cannot do without re-triggering workflows. A PAT with
          # `repo` scope, stored as CLA_SIGNATURES_TOKEN, does the commit.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/dashersw/coyopedal/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: main
          allowlist: dashersw,bot*,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/dashersw/coyopedal/blob/main/CLA.md)
            and sign it by posting a comment here with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
